<div id="keywords-field">
  <label for="keywords">Mots-clés <small class="muted">(séparés par des virgules)</small></label>
  <textarea id="keywords" name="keywords" rows="3" aria-describedby="keywords-help">{{ keywords_value }}</textarea>
  <small id="keywords-help">Vous pouvez les modifier librement après une suggestion.</small>
  {% if suggest_error %}<p class="error" role="alert">{{ suggest_error }}</p>{% endif %}
  <button type="button" class="secondary outline"
          hx-post="/themes/suggest-keywords" hx-include="closest form"
          hx-target="#keywords-field" hx-swap="outerHTML">
    Suggérer des mots-clés <span class="htmx-indicator" aria-hidden="true">…</span>
  </button>
</div>
