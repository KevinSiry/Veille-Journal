{% extends "base.html" %}
{% from "_macros.html" import icon %}
{% block title %}Erreur {{ status_code }}{% endblock %}
{% block content %}
<section class="error-page">
  <p class="error-page__code" aria-hidden="true">{{ status_code }}</p>
  <h1>Erreur {{ status_code }}</h1>
  <p>{{ message }}</p>
  <a href="/" class="btn btn--secondary">{{ icon("arrow-left") }}Retour à l'accueil</a>
</section>
{% endblock %}
